name: CI

# Releases only: pushes to main and pull requests run nothing; a version tag (v1.0.0, v1.0.0-beta.1...) runs it all.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Online wallpaper index is current
        run: python3 tools/wallpapers.py --check
      - name: Lists, install-vidda.sh and tools
        # The venv interpreter, not the runner's python3: the runner has no adb_shell, so
        # running the suite with it leaves test_tv_reboot to its child-rerun workaround
        # instead of running in-process (#1800).
        run: tools/venv/bin/python -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          # About 0.4 MB of code and resources plus 0.85 MB of bundled wallpapers (assets/wallpapers).
          test "$size" -lt 1572864 || { echo "APK is over 1.5 MB; keep the launcher and its wallpapers small"; exit 1; }

  release:
    name: Signed APK to GitHub Releases
    needs: [lists-and-tools, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The release key's certificate. An APK signed with anything else cannot upgrade the TVs already running
      # CleanViddaTV, so a changed or wrong secret stops the release here instead of reaching them.
      CERT_SHA256: 9422bdc9a4273f0e8b8c3fedd865668f2556086e92dc734931339bf4d994459e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches versionName
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" launcher/app/build.gradle)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but build.gradle says versionName $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Signed release build
        working-directory: launcher
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signature
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $CERT_SHA256$" certs.txt || { echo "::error::APK is not signed with the CleanViddaTV release key"; exit 1; }
          mkdir dist
          cp "$apk" "dist/CleanViddaTV-$VERSION.apk"
          (cd dist && sha256sum "CleanViddaTV-$VERSION.apk" > "CleanViddaTV-$VERSION.apk.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.1.0-beta1) is a pre-release.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CleanViddaTV $VERSION" \
            --verify-tag --generate-notes $pre
      - name: Publish to the CDN
        # The launcher's online update reads cleanviddatv/latest.json (stable) or beta.json (with "接收测试版") from
        # download.aikit.stream first, and GitHub only when the CDN cannot be reached. Same R2 bucket and secrets as VsTV.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "::warning::R2 secrets missing: not on the CDN, online update falls back to GitHub"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          endpoint="${R2_ENDPOINT:-https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}"
          base="${R2_PUBLIC_BASE_URL%/}"
          apk="CleanViddaTV-$VERSION.apk"
          aws s3 cp "dist/$apk" "s3://$R2_BUCKET/cleanviddatv/$VERSION/$apk" --endpoint-url "$endpoint" \
            --content-type application/vnd.android.package-archive
          git fetch -q --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)')" \
          APK_URL="$base/cleanviddatv/$VERSION/$apk" \
          GITHUB_APK="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$apk" \
          SHA256="$(cut -d' ' -f1 "dist/$apk.sha256")" SIZE="$(stat -c %s "dist/$apk")" \
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              "version": os.environ["VERSION"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "notes": os.environ.get("NOTES", "").strip(),
              "apk": os.environ["APK_URL"],
              "github_apk": os.environ["GITHUB_APK"],
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["SIZE"]),
          }
          open("manifest.json", "w", encoding="utf-8").write(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          print(open("manifest.json", encoding="utf-8").read())
          PY
          # A beta goes to beta.json only; a stable release to both, so the beta channel moves on to it too.
          channels="beta.json"
          case "$GITHUB_REF_NAME" in *-*) ;; *) channels="latest.json beta.json" ;; esac
          for name in $channels; do
            aws s3 cp manifest.json "s3://$R2_BUCKET/cleanviddatv/$name" --endpoint-url "$endpoint" \
              --content-type "application/json; charset=utf-8" --cache-control "max-age=300"
          done
      - name: Wallpapers to the CDN
        # The launcher's wallpaper gallery reads cleanviddatv/wallpapers/ from the CDN first (then jsDelivr, then GitHub).
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets missing: wallpapers are served from jsDelivr / GitHub only"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          endpoint="${R2_ENDPOINT:-https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}"
          aws s3 sync wallpapers/files "s3://$R2_BUCKET/cleanviddatv/wallpapers/files" --endpoint-url "$endpoint" --content-type image/webp
          aws s3 sync wallpapers/thumbs "s3://$R2_BUCKET/cleanviddatv/wallpapers/thumbs" --endpoint-url "$endpoint" --content-type image/webp
          aws s3 cp wallpapers/index.json "s3://$R2_BUCKET/cleanviddatv/wallpapers/index.json" --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" --cache-control "max-age=300"
