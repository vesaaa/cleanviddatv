name: Wallpapers

# The online wallpapers reach the CDN as soon as they change on main, without a release: the launcher's gallery reads
# cleanviddatv/wallpapers/index.json from the CDN first and GitHub only when the CDN cannot be reached.
on:
  push:
    branches: [main]
    paths: ['wallpapers/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Wallpapers to the CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Index is current
        run: python3 tools/wallpapers.py --check
      - name: Upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets missing: wallpapers are served from GitHub only"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          endpoint="${R2_ENDPOINT:-https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}"
          # Pictures first and the index last, so the index never names a picture the CDN does not have yet.
          aws s3 sync wallpapers/files "s3://$R2_BUCKET/cleanviddatv/wallpapers/files" --endpoint-url "$endpoint" --content-type image/webp
          aws s3 sync wallpapers/thumbs "s3://$R2_BUCKET/cleanviddatv/wallpapers/thumbs" --endpoint-url "$endpoint" --content-type image/webp
          aws s3 cp wallpapers/index.json "s3://$R2_BUCKET/cleanviddatv/wallpapers/index.json" --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" --cache-control "max-age=300"
