plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.vesaaa.cleanviddatv'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.vesaaa.cleanviddatv')
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '1.2.1'
    }

    signingConfigs {
        // The CleanViddaTV release key, only where KEYSTORE names it: the v* tag workflow decodes it from the
        // repo secrets. Every published APK must carry it, or the next one cannot install over it.
        def keystore = System.getenv('KEYSTORE')
        if (keystore) {
            release {
                storeFile file(keystore)
                storeType 'PKCS12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local builds (build-and-install.sh) keep the debug key, so they install over a debug build.
            signingConfig System.getenv('KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for Updates' parsers: android.jar's copy is a stub on the JVM.
    testImplementation 'org.json:json:20231013'
}
